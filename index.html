<body>
  <div id="game"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="lead" class="panel" hidden></div>
    <div id="objective" class="objective" hidden></div>
    <div id="foe" class="foe" hidden></div>
    <div id="area" class="area"></div>
    <div id="toasts"></div>
    <div id="moves"></div>
    <div id="perf" hidden></div>
    <div id="saved">Jogo salvo</div>
  </div>
  <button id="menu-btn" aria-label="Abrir o menu"></button>

  <!-- Controles de toque (celular) -->
  <div id="touch" hidden>
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="tbtns">
      <button class="tb move" data-slot="0"></button>
      <button class="tb move" data-slot="1"></button>
      <button class="tb move" data-slot="2"></button>
      <button class="tb move" data-slot="3"></button>
      <button class="tb small" id="t-ball" aria-label="Poké Bola"></button>
      <button class="tb small" id="t-dodge" aria-label="Esquiva"></button>
      <button class="tb small" id="t-act" aria-label="Falar"></button>
      <button class="tb small" id="t-swap" aria-label="Trocar Pokémon"></button>
    </div>
  </div>

  <!-- Interface (título, diálogo, menu) -->
  <div id="ui"></div>

  <div id="rotate" hidden>
    <div class="rot-ic"><div class="rot-phone"></div></div>
    <b>Gire o aparelho</b>
    <p>Alvorada fica melhor com o celular deitado.</p>
    <button>Jogar assim mesmo</button>
  </div>

  <div id="loading">
    <div class="ld-logo"><small>Pokémon</small><b>Alvorada</b></div>
    <div class="ld-ball"></div>
    <div class="ld-bar"><i></i></div>
    <span class="ld-txt">Carregando o jogo…</span>
  </div>
  <script>
    // Barra de carregamento real: 1ª parte conta os arquivos baixados (o total da última visita fica guardado);
    // 2ª parte vem do main.js (window.__boot(fração, texto)) enquanto o mundo é montado.
    (function () {
      var el = document.getElementById('loading'), bar = el.querySelector('.ld-bar i'), txt = el.querySelector('.ld-txt');
      var expected = 150, n = 0, shown = 0, target = 0.02, stage = 0;
      try { expected = +localStorage.getItem('alvorada.boot.n') || 150; } catch (e) {}
      function paint() { shown += (target - shown) * 0.2; bar.style.transform = 'scaleX(' + shown.toFixed(3) + ')'; if (el.isConnected) requestAnimationFrame(paint); }
      requestAnimationFrame(paint);
      try {
        new PerformanceObserver(function (l) {
          n += l.getEntries().length;
          if (!stage) target = Math.max(target, Math.min(0.7, 0.7 * n / expected));
        }).observe({ type: 'resource', buffered: true });
      } catch (e) {}
      window.__boot = function (k, label) { stage = 1; target = Math.max(target, k); if (label) txt.textContent = label; };
      window.__bootDone = function () {
        try { localStorage.setItem('alvorada.boot.n', String(performance.getEntriesByType('resource').length)); } catch (e) {}
        target = 1; el.classList.add('done'); setTimeout(function () { el.remove(); }, 450);
      };
      window.addEventListener('error', function (e) { if (el.isConnected && !stage) txt.textContent = 'Algo deu errado ao carregar. Recarregue a página.'; });
    })();
  </script>
  <script type="module" src="src/main.js"></script>
</body>
