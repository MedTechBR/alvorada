<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a1e">
  <title>Pokémon Alvorada</title>
  <link rel="stylesheet" href="src/ui/style.css">
  <script type="importmap">
    { "imports": { "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.mjs" } }
  </script>
</head>
<body>
  <div id="game"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="lead" class="panel"></div>
    <div id="area" class="area"></div>
    <div id="toasts"></div>
    <div id="moves"></div>
    <div id="perf" hidden></div>
  </div>

  <!-- Controles de toque (celular) -->
  <div id="touch" hidden>
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="tbtns">
      <button class="tb move" data-slot="0"></button>
      <button class="tb move" data-slot="1"></button>
      <button class="tb move" data-slot="2"></button>
      <button class="tb move" data-slot="3"></button>
      <button class="tb small" id="t-ball">◓</button>
      <button class="tb small" id="t-dodge">»</button>
      <button class="tb small" id="t-act">A</button>
      <button class="tb small" id="t-swap">⇄</button>
    </div>
  </div>

  <div id="loading">Carregando…</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
